[package]
name = "poemreader"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
encoding_rs = "0.8"
flate2 = "1"
gpui-kit = "0.9.1"
hayro = "0.9"
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }
markdown = "1"
quick-xml = "0.41"
resvg = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.10"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# 发布版瘦身：全程 LTO + 单代码生成单元 + 去符号。
# 26.8MB -> 24.0MB（zip 10.2 -> 9.3MB）；代价是链接期从约 2 分钟涨到约 9 分钟。
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
